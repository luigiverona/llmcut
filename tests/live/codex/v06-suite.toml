schema_version = "1"
agent = "codex"
repetitions = 3
order = "random"
seed = 6060
timeout_seconds = 240
repository_root = "../../fixtures/benchmarks"

[execution]
model = "gpt-5.6-terra"
reasoning_effort = "low"
sandbox = "workspace-write"
approval_policy = "never"
backend = "sdk"
auth_mode = "existing-session"
comparison_design = "standard-baseline"
context_strategy = "adaptive"
orientation_budget = 200
retrieval_budget = 4096
environment_allowlist = []

[[tasks]]
id = "ambiguous-multi-module"
repository = "python-defect"
prompt = "A callback deadline is interpreted in the wrong unit along the delivery call chain. Diagnose and fix it, then run the repository validation."
validation = [["python", "tests/validate_callback.py"]]
allowed_changes = ["app/callback.py"]
forbidden_changes = ["app/config.py", "app/reporting.py"]
required_files = ["app/callback.py", "app/config.py", "tests/validate_callback.py"]

[[tasks]]
id = "cross-cutting-configuration"
repository = "config-change"
prompt = "Deployment defaults disagree on the Canadian region. Make application behavior, configuration, and operator documentation consistent, then validate."
validation = [["python", "tests/validate.py"]]
allowed_changes = ["app/settings.py", "config.json", "docs/deployment.md"]
forbidden_changes = ["app/observability.py"]

[[tasks]]
id = "large-diagnostic"
repository = "large-failure"
prompt = "Find the actionable failure among the diagnostics, correct the implementation, and run the repository validation."
validation = [["python", "tests/validate.py"]]
allowed_changes = ["app/parser.py"]
required_files = ["test-output.log", "app/parser.py"]

[[tasks]]
id = "dependency-tracing"
repository = "python-defect"
prompt = "Requests traversing the callback delivery service use a deadline in the wrong unit. Trace the call chain, correct the source, and validate."
validation = [["python", "tests/validate_callback.py"]]
allowed_changes = ["app/callback.py"]
forbidden_changes = ["app/api.py", "app/http.py", "app/service.py", "app/transport.py"]

[[tasks]]
id = "long-history-checkpoint"
repository = "history"
prompt = "Resume the unresolved retry decision from the verified project record, implement the remaining behavior, and validate it."
validation = [["python", "tests/validate.py"]]
allowed_changes = ["app/worker.py"]
forbidden_changes = ["checkpoint.md", "history.log"]
required_files = ["checkpoint.md", "history.log"]

[[tasks]]
id = "no-benefit-control"
repository = "python-defect"
prompt = "Fix app/callback.py timeout units and run python tests/validate_callback.py."
validation = [["python", "tests/validate_callback.py"]]
allowed_changes = ["app/callback.py"]
required_files = ["app/callback.py"]
